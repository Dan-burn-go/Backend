spring:
  application:
    name: service-mobility
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

odsay:
  api:
    key: ${ODSAY_API_KEY:}

server:
  port: 8084
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTLP_URL:http://localhost:4318/v1/metrics}
        step: 10s
    tracing:
      endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      odsay:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.danburn.mobility.exception.OdsayServerException
        ignore-exceptions:
          - com.danburn.common.exception.GlobalException
  retry:
    instances:
      odsay:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - com.danburn.mobility.exception.OdsayServerException
        ignore-exceptions:
          - com.danburn.common.exception.GlobalException

logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
  level:
    com.danburn: DEBUG
